# kernel config
#
# NOTE: `overwrite: true` is REQUIRED on all storage.files (incl. those from
# hook-fcar.sh): the hook restarts the VM, so ignition re-applies over existing
# files; without overwrite it fails ("file already exists") and the VM hangs in
# an emergency shell every boot.
#
# storage:
#   files:
    - path: /etc/sysctl.d/20-silence-audit.conf
      mode: 0644
      overwrite: true
      contents:
        inline: |
          # Raise console message logging level from DEBUG (7) to WARNING (4)
          # to hide audit messages from the interactive console
          kernel.printk=4
    - path: /etc/flatcar/update.conf
      mode: 0644
      overwrite: true
      contents:
        inline: |
          REBOOT_STRATEGY=off
    - path: /etc/systemd/journald.conf.d/90-volatile.conf
      mode: 0644
      overwrite: true
      contents:
        inline: |
          [Journal]
          Storage=volatile
          RuntimeMaxUse=128M


systemd:
  units:
    - name: locksmithd.service
      mask: true
    - name: docker.service
      mask: true
    - name: docker.socket
      mask: true
    - name: systemd-sysupdate-reboot.timer
      mask: true
    - name: systemd-sysupdate-reboot.service
      mask: true
